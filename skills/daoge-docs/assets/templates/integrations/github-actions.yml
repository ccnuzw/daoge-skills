name: DAOGE Docs Project Gate

on:
  pull_request:
    paths:
      - "**"
      - ".github/workflows/daoge-docs.yml"
  push:
    branches: [main]
    paths:
      - "**"
      - ".github/workflows/daoge-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-gate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 环境与技术栈诊断
        run: python .daoge-docs/daoge_docs.py doctor --root . --json
      - name: 文档、工作台与 Goal 基线
        run: python .daoge-docs/daoge_docs.py ci-check --root . --json
