openapi: 3.0.3
info:
  title: {{项目名}} API
  version: "{{活跃版本}}"
  description: |
    字段级权威接口定义。公共语义（鉴权、分页、幂等、错误包体）见
    {{文档目录}}/04-技术架构/当前版本/{{活跃版本}}-接口契约.md。
servers:
  - url: http://localhost:8080
    description: 本地开发
tags:
  - name: example
    description: 示例分组，按领域替换
paths:
  /api/example:
    post:
      tags: [example]
      summary: <示例接口>
      operationId: exampleCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExampleRequest"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExampleResponse"
        "400":
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ExampleRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 64
    ExampleResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
    ErrorBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
            key:
              type: string
            message:
              type: string
