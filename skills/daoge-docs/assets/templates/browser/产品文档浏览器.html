    .directory-panel { padding: 14px; }

    .directory-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 11px; }
    .directory-row:last-child { border-bottom: 0; }
    .directory-row button { border: 0; background: transparent; color: var(--teal); text-align: left; padding: 0; }
    .command-palette { position: fixed; inset: 0; display: none; place-items: start center; padding-top: 14vh; background: rgba(24,32,32,.28); z-index: 120; }
    .command-palette.open { display: grid; }
    .command-box { width: min(620px, calc(100vw - 28px)); border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
    .command-box input { width: 100%; height: 46px; padding: 0 15px; border: 0; border-bottom: 1px solid var(--line); outline: 0; background: var(--surface-soft); }
    .command-items { max-height: 360px; overflow: auto; }
    .command-item { display: flex; justify-content: space-between; gap: 15px; width: 100%; padding: 11px 15px; border: 0; border-bottom: 1px solid var(--line); background: white; color: var(--ink); text-align: left; }
    .command-item:hover, .command-item.active { background: var(--teal-soft); }
    .change-summary { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 1px; border: 1px solid var(--line); background: var(--line); }
    .change-count { padding: 11px 13px; background: var(--surface); }
    .change-count span, .change-count strong { display: block; }
    .change-count span { color: var(--muted); font-size: 10px; }
    .change-count strong { margin-top: 2px; font: 750 18px/1.2 var(--mono); }
    .change-row { display: grid; grid-template-columns: 92px minmax(120px,.7fr) minmax(0,1.3fr) auto; gap: 12px; align-items: center; min-height: 48px; padding: 8px 2px; border-bottom: 1px solid var(--line); font-size: 11px; }
    .map-modes { display: flex; gap: 4px; overflow: auto; padding-bottom: 8px; }
    .map-mode { flex: 0 0 auto; min-height: 32px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface); color: var(--muted); }
    .map-mode.active { border-color: var(--teal); background: var(--teal-soft); color: var(--teal); font-weight: 750; }
    .map-summary { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: end; padding: 15px 0; border-bottom: 1px solid var(--line-strong); }
    .map-node-list { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
    .map-node { padding: 11px 12px; border-left: 3px solid var(--indigo); background: var(--surface); }
    .map-node strong, .map-node span { display: block; }
    .map-node span { margin-top: 3px; color: var(--muted); font-size: 10px; }
    .freshness-summary { display: flex; flex-wrap: wrap; gap: 7px; }
    .freshness-reason { color: var(--rose); font-size: 11px; }
    .command-item small { color: var(--muted); }

    @media (max-width: 1180px) {
      .app { grid-template-columns: 244px minmax(0,1fr); }
      .topbar { grid-template-columns: 244px minmax(260px,1fr) 390px; }
      .rightbar { display: none; }
      .search-results { left: 260px; width: min(720px, calc(100vw - 280px)); }
      .stats { grid-template-columns: repeat(5,minmax(0,1fr)); }
    }
    @media (max-width: 940px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0,1fr); }
      .topbar { grid-template-columns: minmax(0,1fr) auto; grid-template-rows: 48px 46px 42px; gap: 0 10px; height: auto; padding: 0 12px 8px; }
      .brand { grid-column: 1; grid-row: 1; }
      .mobile-tools { grid-column: 2; grid-row: 1; display: flex; gap: 4px; }
      .mobile-tools button { width: auto; padding: 0 9px; border: 1px solid var(--line); font-size: 11px; }
      .searchbar { grid-column: 1 / -1; grid-row: 2; }
      .top-actions { grid-column: 1 / -1; grid-row: 3; justify-content: flex-start; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
      .segmented { display: flex; width: max-content; min-width: 100%; }
      .segmented button { flex: 0 0 auto; min-width: 70px; padding: 0 9px; font-size: 12px; }
      .sidebar, .rightbar { position: fixed; top: 0; bottom: 0; z-index: 100; width: min(320px, 88vw); box-shadow: var(--shadow); display: block; transition: transform .18s ease; }
      .sidebar { left: 0; transform: translateX(-105%); }
      .rightbar { right: 0; transform: translateX(105%); }
      body.nav-open .sidebar, body.outline-open .rightbar { transform: translateX(0); }
      .overlay { position: fixed; inset: 0; z-index: 90; background: rgba(24,32,32,.28); }
      body.nav-open .overlay, body.outline-open .overlay { display: block; }
      .drawer-close { display: grid; width: 28px; height: 28px; border: 0; border-radius: 4px; place-items: center; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; }
      .drawer-close:hover, .drawer-close:focus-visible { background: var(--code); color: var(--ink); outline: none; }
      .workspace { grid-column: 1; grid-row: 2; }
      .content { padding: 22px 18px 54px; }
      .search-results { top: 94px; left: 12px; right: 12px; width: auto; max-height: calc(100vh - 112px); }
      .two-column { grid-template-columns: 1fr; }
      .overview-flow-grid { grid-template-columns: 1fr; }
      .visual-grid { grid-template-columns: 1fr; }
      .gate-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .map-node-list { grid-template-columns: 1fr; }
      .risk-map-row { grid-template-columns: 80px repeat(2,minmax(0,1fr)); }
      .risk-map-row > :nth-child(n+4) { grid-column: 2 / -1; }
    }
    @media (max-width: 620px) {
      .brand-mark { width: 31px; height: 31px; }
      .brand h1 { font-size: 13px; }
      .view-header { display: block; }
      .view-actions { margin-top: 13px; }
      .stats { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .gate-grid { grid-template-columns: 1fr; }
      .stat strong { font-size: 20px; }
      .domain-grid { grid-template-columns: 1fr; }
      .status-row, .category-row, .quick-row { grid-template-columns: minmax(0,1fr) auto; }
      .status-row .bar, .category-row .bar, .quick-row > span:nth-child(2) { grid-column: 1 / -1; grid-row: 2; }
      .article { padding: 20px 17px 36px; }
      .article h1 { font-size: 25px; }
      .article h2 { font-size: 19px; }
      .article .table-wrap table { width: max-content; min-width: 100%; }
      .article th, .article td { min-width: 104px; }
      .picker { grid-template-columns: 1fr; }
      .feature-summary { grid-template-columns: 1fr; }
      .feature-tags { justify-content: flex-start; }
      .timeline-item { grid-template-columns: 78px minmax(0,1fr); gap: 10px; }
      .timeline-facts { grid-template-columns: 1fr; }
      .architecture-lanes { grid-template-columns: 1fr; gap: 14px; padding: 14px; }
      .architecture-lane:not(:last-child)::after { display: none; }
      .architecture-relations { grid-template-columns: 1fr; }
      .architecture-relation { border-right: 0; }
      .architecture-footer { align-items: flex-start; flex-direction: column; }
      .evolution-version { flex-basis: min(78vw, 230px); }
      .evolution-matrix .track-column { width: 148px; min-width: 148px; }
      .evolution-focus-head { grid-template-columns: 1fr; }
      .evolution-facts { grid-template-columns: 1fr; }
      .evolution-relation { grid-template-columns: 78px minmax(0,1fr); }
      .evolution-relation > :nth-child(n+3) { grid-column: 2; }
      .map-lanes, .delivery-map { grid-template-columns: 1fr; gap: 14px; }
      .map-lane:not(:last-child)::after { display: none; }
      .map-flow { display: grid; gap: 0; overflow: visible; padding-bottom: 0; }
      .map-flow-step { width: 100%; }
      .map-flow-arrow { width: 100%; min-height: 34px; grid-template-columns: auto auto; justify-content: center; }
      .map-flow-arrow strong { transform: rotate(90deg); }
      .map-flow-arrow span { max-width: none; }
      .map-version-path { grid-template-columns: 1fr; }
      .data-map-row { grid-template-columns: 1fr; gap: 9px; }
      .data-map-party { padding-top: 0; }
      .delivery-picker { grid-template-columns: 1fr; }
      .risk-map-row { grid-template-columns: 1fr; gap: 8px; }
      .risk-map-row > :nth-child(n) { grid-column: auto; }
      .workbench-selector, .decision-strip { grid-template-columns: 1fr; }
      .progress-strip, .change-summary { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .blocker-row, .change-row { grid-template-columns: auto minmax(0,1fr); }
      .blocker-row .command, .change-row > :last-child { grid-column: 2; }
    }
    @media print {
      body { overflow: visible; background: white; }
      .app { display: block; height: auto; }
      .topbar, .sidebar, .rightbar, .progress, .search-results { display: none !important; }
      .workspace { overflow: visible; }
      .content { width: 100%; padding: 0; }
      .article { border: 0; box-shadow: none; padding: 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" title="{{PROJECT_CODE}}">{{PROJECT_CODE}}</div>
        <div class="brand-copy">
          <h1>{{PROJECT_NAME}}</h1>
          <small id="loadStatus">{{VERSION}} 文档空间</small>
        </div>
      </div>
      <div class="searchbar">
        <label class="sr-only" for="searchInput">搜索文档</label>
        <input id="searchInput" autocomplete="off" placeholder="搜索需求、功能、API、数据、风险或决策">
        <span class="search-key">/</span>
        <button class="icon-button clear-search" id="clearSearch" aria-label="清空搜索" title="清空搜索">X</button>
      </div>
      <div class="top-actions">
        <div class="segmented" aria-label="视图切换">
          <button class="active" data-view="workbench">工作台</button>
          <button data-view="overview">总览</button>
          <button data-view="reader">阅读</button>
          <button data-view="map">图谱</button>
          <button data-view="evolution">功能演进</button>
          <button data-view="timeline">时间线</button>
        </div>
      </div>
      <div class="mobile-tools">
        <button class="icon-button" id="openNav" title="文档目录">目录</button>
        <button class="icon-button" id="openOutline" title="章节和决策">章节</button>
      </div>
    </header>

    <aside class="sidebar" aria-label="文档目录">
      <div class="side-head"><span>文档目录</span><span class="side-head-actions"><span class="count-badge" id="docCount">0</span><button class="drawer-close" id="closeNav" aria-label="关闭文档目录" title="关闭文档目录">&times;</button></span></div>
      <nav class="doc-tree" id="docTree"></nav>
    </aside>

    <main class="workspace" id="workspace">
      <div class="progress"><span id="readProgress"></span></div>
      <div class="content" id="content"></div>
    </main>

    <aside class="rightbar" aria-label="辅助导航">
      <div class="side-head"><span>阅读辅助</span><span class="side-head-actions"><span class="count-badge" id="outlineCount">0</span><button class="drawer-close" id="closeOutline" aria-label="关闭阅读辅助" title="关闭阅读辅助">&times;</button></span></div>
      <div class="right-scroll">
        <section class="right-section">
          <h3>章节</h3>
          <nav class="outline" id="outline"></nav>
        </section>
        <section class="right-section">
          <h3>关键决策</h3>
          <ul class="decision-list" id="decisionList"></ul>
        </section>
      </div>
    </aside>
  </div>
  <div class="overlay" id="overlay"></div>
  <div class="search-results" id="searchResults" role="dialog" aria-label="搜索结果"></div>
  <div class="command-palette" id="commandPalette" role="dialog" aria-modal="true" aria-label="命令面板">
    <div class="command-box">
      <label class="sr-only" for="commandInput">输入命令</label>
      <input id="commandInput" autocomplete="off" placeholder="输入命令或视图名称">
      <div class="command-items" id="commandItems"></div>
    </div>
  </div>

  <script src="产品文档浏览器-文档数据.js"></script>
  <script>
    const DATA = window.DAOGE_DOC_BROWSER_DATA || null;
    const state = {
      view: safeGet("daoge-docs.view") || "workbench",
      activeDoc: safeGet("daoge-docs.activeDoc") || "",
      activeFeature: safeGet("daoge-docs.activeFeature") || "",
      activeSection: "",
      panel: "",
      mapMode: safeGet("daoge-docs.mapMode") || "product_architecture",
      evolutionTrack: safeGet("daoge-docs.evolutionTrack") || "",
      evolutionStage: safeGet("daoge-docs.evolutionStage") || "",
      evolutionMilestone: safeGet("daoge-docs.evolutionMilestone") || "",
      query: "",
      collapsed: new Set()
    };
    const els = {
      content: document.getElementById("content"),
      workspace: document.getElementById("workspace"),
      docTree: document.getElementById("docTree"),
      docCount: document.getElementById("docCount"),
      loadStatus: document.getElementById("loadStatus"),
      searchInput: document.getElementById("searchInput"),
      clearSearch: document.getElementById("clearSearch"),
      searchResults: document.getElementById("searchResults"),
      outline: document.getElementById("outline"),
      outlineCount: document.getElementById("outlineCount"),
      decisionList: document.getElementById("decisionList"),
      readProgress: document.getElementById("readProgress"),
      overlay: document.getElementById("overlay"),
      commandPalette: document.getElementById("commandPalette"),
      commandInput: document.getElementById("commandInput"),
      commandItems: document.getElementById("commandItems")
    };
    let readerPersistTimer = 0;

    function init() {
      if (!DATA || !Array.isArray(DATA.documents)) {
        els.content.innerHTML = '<div class="empty">文档数据未加载。请确认 HTML 与文档数据 JS 位于同一目录。</div>';
        return;
      }
      const hash = readHash();
      if (hash.view) state.view = hash.view;
      if (hash.doc) state.activeDoc = hash.doc;
      if (hash.feature) state.activeFeature = hash.feature;
      if (hash.panel) state.panel = hash.panel;
      if (hash.section) state.activeSection = hash.section;
      if (hash.map && (DATA.views && DATA.views.maps || {})[hash.map]) state.mapMode = hash.map;
      if (hash.track) state.evolutionTrack = hash.track;
      if (hash.stage) state.evolutionStage = hash.stage;
      if (hash.milestone) state.evolutionMilestone = hash.milestone;
      if (!DATA.documents.some(doc => doc.path === state.activeDoc)) {
        const preferred = DATA.documents.find(doc => doc.path.includes("02-产品与版本/产品蓝图.md")) || DATA.documents[0];
        state.activeDoc = preferred ? preferred.path : "";
      }
      if (!DATA.features.some(feature => feature.id === state.activeFeature)) {
        state.activeFeature = DATA.features[0] ? DATA.features[0].id : "";
      }
      els.docCount.textContent = String(DATA.documents.length);
      els.loadStatus.textContent = `${DATA.project.current_version} · ${DATA.documents.length} 份文档 · 离线数据`;
      bindEvents();
      renderTree();
      renderDecisions();
      setView(state.view, false);
      if (hash.section && state.view === "reader") window.setTimeout(() => scrollToMarkdownFragment(hash.section), 0);
    }

    function bindEvents() {
      document.querySelectorAll("[data-view]").forEach(button => {
        button.addEventListener("click", () => setView(button.dataset.view));
      });
      els.searchInput.addEventListener("input", debounce(() => {
        state.query = els.searchInput.value.trim();
        els.clearSearch.style.display = state.query ? "grid" : "none";
        renderSearch();
      }, 80));
      els.searchInput.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          const first = els.searchResults.querySelector("[data-doc],[data-feature]");
          if (first) first.click();
        }
      });
      els.clearSearch.addEventListener("click", clearSearch);
      els.commandPalette.addEventListener("click", event => { if (event.target === els.commandPalette) closeCommandPalette(); });
      els.commandInput.addEventListener("input", renderCommands);
      els.commandInput.addEventListener("keydown", event => {
        if (event.key === "Enter") { const active = els.commandItems.querySelector(".active") || els.commandItems.querySelector("[data-command-index]"); if (active) active.click(); }
        if (event.key === "ArrowDown" || event.key === "ArrowUp") { event.preventDefault(); moveCommandSelection(event.key === "ArrowDown" ? 1 : -1); }
      });
      document.addEventListener("keydown", event => {
        if (event.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
          event.preventDefault();
          els.searchInput.focus();
        }
        if (event.key === "Escape") {
          clearSearch();
          closeDrawers();
          closeCommandPalette();
        }
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") { event.preventDefault(); openCommandPalette(); }
      });
      els.workspace.addEventListener("scroll", () => {
        updateProgress();
        updateOutline();
      }, { passive: true });
      document.getElementById("openNav").addEventListener("click", () => toggleDrawer("nav"));
      document.getElementById("openOutline").addEventListener("click", () => toggleDrawer("outline"));
      document.getElementById("closeNav").addEventListener("click", closeDrawers);
      document.getElementById("closeOutline").addEventListener("click", closeDrawers);
      els.overlay.addEventListener("click", closeDrawers);
      window.addEventListener("hashchange", () => {
        const hash = readHash();
        if (hash.feature && DATA.features.some(feature => feature.id === hash.feature)) state.activeFeature = hash.feature;
        if (hash.panel) state.panel = hash.panel;
        if (hash.map && (DATA.views && DATA.views.maps || {})[hash.map]) state.mapMode = hash.map;
        if (hash.track) state.evolutionTrack = hash.track;
        if (hash.stage) state.evolutionStage = hash.stage;
        if (hash.milestone) state.evolutionMilestone = hash.milestone;
        if (hash.doc && DATA.documents.some(doc => doc.path === hash.doc)) {
          openDoc(hash.doc, false, hash.section || "");
        }
        else if (hash.view) setView(hash.view, false);
      });
    }

    function setView(view, persist = true) {
      if (view === "governance") { view = "workbench"; state.panel = "verification"; }
      if (view === "diff") { view = "evolution"; state.panel = "changes"; }
      const allowed = new Set(["workbench", "overview", "reader", "map", "evolution", "timeline"]);
      state.view = allowed.has(view) ? view : "workbench";
      if (persist) safeSet("daoge-docs.view", state.view);
      document.querySelectorAll("[data-view]").forEach(button => button.classList.toggle("active", button.dataset.view === state.view));
      els.content.style.animation = "none";
      void els.content.offsetWidth;
      els.content.style.animation = "";
      if (state.view === "workbench") renderWorkbench();
      if (state.view === "overview") renderOverview();
      if (state.view === "reader") renderReader();
      if (state.view === "map") renderMap();
      if (state.view === "evolution") renderEvolution();
      if (state.view === "timeline") renderTimeline();
      if (state.view !== "reader") els.workspace.scrollTop = 0;
      updateHash(!persist);
      closeDrawers();
      revealActiveTab(".segmented [data-view].active");
    }

    function renderTree() {
      if (Array.isArray(DATA.directories) && DATA.directories.length) {
        const byId = new Map(DATA.directories.map(item => [item.id, item]));
        const renderDirectory = (directoryId, depth = 0) => {
          const directory = byId.get(directoryId);
          if (!directory) return "";
          const collapsed = state.collapsed.has(directoryId);
          const directDocs = DATA.documents.filter(doc => doc.directory_id === directoryId).sort((a,b) => {
            const aReadme = /README|导航|索引/.test(a.title) ? 0 : 1;
            const bReadme = /README|导航|索引/.test(b.title) ? 0 : 1;
            return aReadme - bReadme || a.title.localeCompare(b.title, "zh-CN");
          });
          const children = (directory.child_ids || []).map(child => renderDirectory(child, depth + 1)).join("");
          const docs = directDocs.map(doc => `<button class="doc-button" data-doc="${escapeHtml(doc.path)}" title="${escapeHtml(doc.path)}" style="margin-left:${Math.min(28, depth * 7)}px"><strong>${escapeHtml(doc.title)}</strong><span>${escapeHtml(doc.status)} · ${doc.line_count} 行</span></button>`).join("");
          return `<section class="tree-group"><button class="tree-group-title" data-directory="${escapeHtml(directoryId)}" aria-expanded="${!collapsed}" style="padding-left:${8 + Math.min(24, depth * 8)}px"><span>${escapeHtml(directory.name)}</span><span class="count-badge">${directory.document_count}</span></button><div class="tree-items ${collapsed ? "collapsed" : ""}">${directory.readme_path && directoryId !== "." ? `<button class="doc-button" data-doc="${escapeHtml(directory.readme_path)}" title="目录 README" style="margin-left:${Math.min(28, depth * 7)}px"><strong>进入目录 README</strong><span>统一导航入口</span></button>` : ""}${docs}${children}</div></section>`;
        };
        els.docTree.innerHTML = renderDirectory(".");
        els.docTree.querySelectorAll("[data-directory]").forEach(button => button.addEventListener("click", () => {
          const directory = button.dataset.directory;
          if (state.collapsed.has(directory)) state.collapsed.delete(directory); else state.collapsed.add(directory);
          renderTree();
        }));
        els.docTree.querySelectorAll("[data-doc]").forEach(button => button.addEventListener("click", () => openDoc(button.dataset.doc)));
        return;
      }
      const groups = groupBy(DATA.documents, "category");
      els.docTree.innerHTML = Object.entries(groups).map(([category, docs]) => {
        const collapsed = state.collapsed.has(category);
        return `<section class="tree-group">
          <button class="tree-group-title" data-category="${escapeHtml(category)}" aria-expanded="${!collapsed}">
            <span>${escapeHtml(cleanCategory(category))}</span><span class="count-badge">${docs.length}</span>
          </button>
          <div class="tree-items ${collapsed ? "collapsed" : ""}">
            ${docs.map(doc => `<button class="doc-button ${doc.path === state.activeDoc ? "active" : ""}" data-doc="${escapeHtml(doc.path)}" title="${escapeHtml(doc.path)}">
              <strong>${escapeHtml(doc.title)}</strong><span>${escapeHtml(doc.status)} · ${doc.line_count} 行</span>
            </button>`).join("")}
          </div>
        </section>`;
      }).join("");
      els.docTree.querySelectorAll("[data-category]").forEach(button => button.addEventListener("click", () => {
        const category = button.dataset.category;
        if (state.collapsed.has(category)) state.collapsed.delete(category); else state.collapsed.add(category);
        renderTree();
      }));
      els.docTree.querySelectorAll("[data-doc]").forEach(button => button.addEventListener("click", () => openDoc(button.dataset.doc)));
    }

    function renderWorkbench() {
      const feature = DATA.features.find(item => item.id === state.activeFeature) || DATA.features[0] || null;
      if (feature) state.activeFeature = feature.id;
      const findings = (DATA.findings || []).filter(item => item.status === "open" && (!feature || item.object_id === feature.id || item.object_type === "gate"));
      const severityOrder = {blocking:0, high:1, medium:2, info:3};
      findings.sort((a,b) => (severityOrder[a.severity] ?? 9) - (severityOrder[b.severity] ?? 9) || String(a.id).localeCompare(String(b.id)));
      const blockers = findings.filter(item => ["blocking","high"].includes(item.severity));
      const topBlockers = blockers.slice(0, 3);
      const packet = (DATA.task_packets || []).find(item => item.feature_id === (feature && feature.id));

      const progress = {

          <details class="workbench-detail" data-panel="findings"><summary>完整阻塞清单<span>${findings.length} 项开放 finding</span></summary><div class="workbench-detail-body"><div class="blocker-list">${findings.slice(0,12).map(item => `<div class="blocker-row">${chip(item.severity)}<div><strong>${escapeHtml(item.title)}</strong><span>${escapeHtml(item.reason)}</span></div><button class="command" data-open-finding="${escapeHtml(item.id)}">查看来源</button></div>`).join("") || '<div class="empty">当前没有开放 finding。</div>'}</div></div></details>
          <details class="workbench-detail" data-panel="relations"><summary>关系与来源<span>${relations.length} 条稳定 ID 关系</span></summary><div class="workbench-detail-body"><div class="relation-list">${relations.map(item => `<div class="relation-row"><span class="relation-type">${escapeHtml(item.relation)}</span><span class="relation-id"><code>${escapeHtml(item.from === feature.id ? item.to : item.from)}</code></span><span>${escapeHtml(item.source_section)}</span></div>`).join("") || '<div class="empty">当前功能尚未建立关系边，不根据标题相似度推断。</div>'}</div></div></details>

    const MAP_META = {
      product_architecture: { label: "产品架构", question: "用户从哪里进入，业务领域、内部系统和外部依赖如何衔接？" },
      core_flow: { label: "核心流程", question: "关键业务从输入到结果如何推进，失败时会发生什么？" },
      version_roadmap: { label: "版本路线", question: "各版本解决什么问题，前置能力和退出条件是什么？" },
      data_domains: { label: "数据域", question: "每类数据由谁写入、谁只读，必须保持什么不变量？" },
      delivery_trace: { label: "交付追踪", question: "一个功能由什么约束，并通过哪些验收、测试和任务交付？" },

    function sourceAttributes(source) {
      if (!source || !source.source_path || !DATA.documents.some(doc => doc.path === source.source_path)) return "";
      const section = source.source_section_id || source.source_section || "";
      return `data-open-doc="${escapeHtml(source.source_path)}"${section ? ` data-open-section="${escapeHtml(section)}"` : ""}`;
    }

    function mapWarning(model) {
      if (!model || model.status === "ready") return "";
      const reasons = (model && model.findings || []).map(item => item.reason).filter(Boolean);
      const message = reasons.join("；") || "结构化来源尚未建立。";
      return `<div class="map-warning"><strong>${model && model.status === "blocked" ? "信息不完整" : "暂不可用"}</strong><span>${escapeHtml(message)}${model && model.nodes && model.nodes.length ? "。下方仅展示已登记内容，不能视为完整项目关系。" : ""}</span></div>`;
    }

    function renderMapEntity(node) {
      const source = nodeSource(node);
      const tag = source ? "button" : "div";
      return `<${tag} class="map-entity" data-kind="${escapeHtml(node.type || "entity")}" ${sourceAttributes(source)} title="${escapeHtml(`${node.id} · ${node.detail || node.label}`)}"><strong>${escapeHtml(node.label)}</strong><span>${escapeHtml(node.detail || "来源已登记")}</span></${tag}>`;
    }

    function renderProductArchitectureMap(model) {
      const nodes = model.nodes || [];
      const groups = [
        { label: "用户与入口", types: new Set(["user_entry", "user", "actor"]) },
        { label: "业务领域", types: new Set(["domain", "data_domain"]) },
        { label: "系统与依赖", types: null }
      ];
      const assigned = new Set();
      const lanes = groups.map(group => {
        const items = nodes.filter(node => {
          if (!group.types) return !assigned.has(node.id);
          if (!group.types.has(node.type)) return false;
          assigned.add(node.id);
          return true;
        }).sort((a,b) => String(a.label).localeCompare(String(b.label), "zh-CN"));
        const shown = items.slice(0, 10);
        return `<section class="map-lane"><header><h4>${group.label}</h4><span>${items.length}</span></header><div class="map-lane-list">${shown.map(renderMapEntity).join("") || '<div class="empty">当前没有该类节点。</div>'}${items.length > shown.length ? `<div class="map-more">另有 ${items.length-shown.length} 项，请在完整关系中查看</div>` : ""}</div></section>`;
      }).join("");
      return `<div class="map-lane-board"><div class="map-lanes">${lanes}</div></div>`;
    }

    function renderCoreFlowMap(model) {
      const nodes = (model.nodes || []).slice().sort((a,b) => Number.parseInt(a.order,10)-Number.parseInt(b.order,10) || String(a.id).localeCompare(String(b.id), "zh-CN"));
      const edges = model.edges || [];
      return `<div class="map-flow">${nodes.map((node,index) => {
        const source = nodeSource(node);
        const tag = source ? "button" : "article";
        const next = nodes[index+1];
        const edge = next ? edges.find(item => item.from === node.id && item.to === next.id) : null;
        const arrow = next ? `<div class="map-flow-arrow"><strong>›</strong><span>${escapeHtml(edge ? relationLabel(edge) : "关系未登记")}</span></div>` : "";
        return `<${tag} class="map-flow-step" ${sourceAttributes(source)} title="${escapeHtml(node.id)}"><header><span>步骤 ${String(index+1).padStart(2,"0")}</span><small>${escapeHtml(node.actor || node.system || "参与者未登记")}</small></header><h4>${escapeHtml(node.label)}</h4><p><strong>结果：</strong>${escapeHtml(node.outcome || node.detail || "未登记")}</p><p class="failure"><strong>失败：</strong>${escapeHtml(node.failure || "未登记")}</p></${tag}>${arrow}`;
      }).join("")}</div>`;
    }

    function renderVersionRoadmapMap(model) {
      const nodes = (model.nodes || []).slice().sort((a,b) => Number(a.order||0)-Number(b.order||0) || String(a.id).localeCompare(String(b.id), "zh-CN"));
      const nodeById = new Map(nodes.map(node => [node.id,node]));
      const dependencies = (model.edges || []).filter(edge => nodeById.has(edge.from) && nodeById.has(edge.to));
      const cards = nodes.map(node => {
        const source = nodeSource(node);
        const tag = source ? "button" : "article";
        const rawStatus = String(node.planning_status || "unknown").toLowerCase();
        const statusClass = node.id === DATA.project.current_version || rawStatus.includes("current") || rawStatus.includes("当前") ? "current" : rawStatus.includes("planning") || rawStatus.includes("规划") ? "planning" : "";
        return `<${tag} class="map-version-card ${statusClass}" ${sourceAttributes(source)} title="${escapeHtml(node.id)}"><header>${chip(node.planning_status || "unknown")}<span>${escapeHtml(node.id === DATA.project.current_version ? "当前" : "")}</span></header><h4>${escapeHtml(node.label)}</h4><p>${escapeHtml(node.goal || node.detail || "版本目标未登记")}</p><dl><dt>前置</dt><dd>${escapeHtml(node.prerequisites || "未登记")}</dd><dt>退出</dt><dd>${escapeHtml(node.exit_condition || "未登记")}</dd></dl></${tag}>`;
      }).join("");
      const dependencyRows = dependencies.map(edge => `<span>${escapeHtml(nodeById.get(edge.from).label)} → ${escapeHtml(nodeById.get(edge.to).label)} · ${escapeHtml(edge.label || relationLabel(edge))}</span>`).join("");
      return `<div class="map-version-path">${cards}</div><div class="map-dependencies">${dependencyRows || "没有登记版本之间的直接依赖；前置能力保留在各版本卡中。"}</div>`;

    function renderDataDomainsMap(model) {
      const nodes = model.nodes || [];
      const nodeById = new Map(nodes.map(node => [node.id,node]));
      const domains = nodes.filter(node => node.type === "data_domain").sort((a,b) => String(a.label).localeCompare(String(b.label), "zh-CN"));
      const party = (ids, emptyText) => ids.length ? ids.map(id => `<strong title="${escapeHtml(id)}">${escapeHtml(nodeById.get(id)?.label || id)}</strong>`).join("") : `<span>${emptyText}</span>`;
      return `<div class="data-map">${domains.map(domain => {
        const source = nodeSource(domain);
        const owners = (model.edges || []).filter(edge => edge.to === domain.id && edge.relation === "owns").map(edge => edge.from);
        const readers = (model.edges || []).filter(edge => edge.to === domain.id && edge.relation === "reads").map(edge => edge.from);

        return `<div class="data-map-row"><div class="data-map-party"><span>唯一写入者</span>${party(owners,"未登记")}</div><${tag} class="data-map-domain" ${sourceAttributes(source)} title="${escapeHtml(domain.id)}"><strong>${escapeHtml(domain.label)}</strong><span>${escapeHtml(domain.invariant || domain.detail || "数据不变量未登记")}</span></${tag}><div class="data-map-party"><span>只读使用者</span>${party(readers,"未登记")}</div></div>`;
      }).join("")}</div>`;
    }

    function deliveryTypeLabel(type) {
      return ({requirement:"需求",decision:"决策",adr:"ADR",version:"版本",feature:"功能",acceptance:"验收",branch:"分支",test:"测试",evidence:"证据",task:"开发任务",entity:"关联对象"})[type] || type || "关联对象";
    }

    function renderDeliveryTraceMap(model) {
      const nodes = model.nodes || [];
      const edges = model.edges || [];
      const nodeById = new Map(nodes.map(node => [node.id,node]));
      const features = nodes.filter(node => node.type === "feature");
      const focus = nodeById.get(state.activeFeature)?.type === "feature" ? state.activeFeature : features[0]?.id || "";
      if (focus) state.activeFeature = focus;
      const visible = new Set(focus ? [focus] : []);
      for (let depth=0; depth<2; depth+=1) {
        const current = new Set(visible);
        edges.forEach(edge => {
          if (current.has(edge.from)) visible.add(edge.to);
          if (current.has(edge.to)) visible.add(edge.from);
        });
        if (visible.size > 28) break;
      }
      const visibleNodes = nodes.filter(node => visible.has(node.id)).slice(0,28);
      const visibleIds = new Set(visibleNodes.map(node => node.id));
      const visibleEdges = edges.filter(edge => visibleIds.has(edge.from) && visibleIds.has(edge.to));
      const upstreamTypes = new Set(["requirement","decision","adr","version"]);
      const columns = {
        upstream: visibleNodes.filter(node => upstreamTypes.has(node.type) || (node.type === "feature" && node.id !== focus)),
        center: visibleNodes.filter(node => node.id === focus),
        downstream: visibleNodes.filter(node => node.id !== focus && !upstreamTypes.has(node.type) && node.type !== "feature")
      };
      const renderNode = node => {
        const source = nodeSource(node);
        const tag = source ? "button" : "div";
        const relations = visibleEdges.filter(edge => edge.from === node.id || edge.to === node.id).map(relationLabel).filter((value,index,array) => array.indexOf(value) === index).slice(0,3);
        return `<${tag} class="delivery-node" ${sourceAttributes(source)} title="${escapeHtml(node.id)}"><small>${escapeHtml(deliveryTypeLabel(node.type))}</small><strong>${escapeHtml(node.label)}</strong><span>${escapeHtml(relations.join(" · ") || "关系已登记")}</span></${tag}>`;
      };
      const options = features.map(node => `<option value="${escapeHtml(node.id)}" ${node.id===focus?"selected":""}>${escapeHtml(node.id)} · ${escapeHtml(node.label)}</option>`).join("");
      const lane = (key,label,extra="") => `<section class="delivery-lane ${extra}"><header>${label}</header><div class="delivery-items">${columns[key].map(renderNode).join("") || '<div class="empty">当前没有关联项。</div>'}</div></section>`;
      return `<div class="delivery-picker"><label for="deliveryFeature">聚焦功能</label><select id="deliveryFeature">${options}</select></div><div class="delivery-map">${lane("upstream","来源与约束")}${lane("center","当前功能","center")}${lane("downstream","验收与交付")}</div>`;
    }

    function normalizedRisk(value) {
      const text = String(value || "").toLowerCase();
      if (/high|critical|高|严重/.test(text)) return { key:"high", label:"高风险", rank:0 };
      if (/medium|中/.test(text)) return { key:"medium", label:"中风险", rank:1 };
      if (/low|standard|低|标准/.test(text)) return { key:"standard", label:"标准风险", rank:2 };
      return { key:"unknown", label:value || "等级未登记", rank:3 };
    }

    function renderRiskHotspotsMap(model) {
      const risks = (model.nodes || []).filter(node => node.type === "risk").sort((a,b) => normalizedRisk(a.severity).rank-normalizedRisk(b.severity).rank || String(a.label).localeCompare(String(b.label),"zh-CN"));
      return `<div class="risk-map">${risks.map(node => {
        const severity = normalizedRisk(node.severity);
        const source = nodeSource(node);
        const tag = source ? "button" : "article";
        return `<${tag} class="risk-map-row ${severity.key}" ${sourceAttributes(source)} title="${escapeHtml(node.id)}"><div><strong>${escapeHtml(severity.label)}</strong><small>${escapeHtml(node.risk_target || "对象未登记")}</small></div><div><strong>${escapeHtml(node.label)}</strong><span>风险原因</span></div><div><strong>${escapeHtml(node.impact || "影响未登记")}</strong><span>可能影响</span></div><div><strong>${escapeHtml(node.control || "控制未登记")}</strong><span>控制措施</span></div><div><strong>${escapeHtml(node.verification || "未登记")}</strong><span>验证入口</span></div></${tag}>`;
      }).join("")}</div>`;
    }

    function renderMapModel(model) {
      if (!model || !(model.nodes || []).length) return `<div class="empty">${escapeHtml((model && model.findings || []).map(item => item.reason).filter(Boolean).join("；") || "结构化来源未建立。")}</div>`;
      if (model.id === "product_architecture") return renderProductArchitectureMap(model);
      if (model.id === "core_flow") return renderCoreFlowMap(model);
      if (model.id === "version_roadmap") return renderVersionRoadmapMap(model);
      if (model.id === "data_domains") return renderDataDomainsMap(model);
      if (model.id === "delivery_trace") return renderDeliveryTraceMap(model);
      if (model.id === "risk_hotspots") return renderRiskHotspotsMap(model);
      return '<div class="empty">该图谱类型尚未建立面向人的呈现器。</div>';
    }

    function nodeSource(node) {
      return (node && node.sources || []).find(item => DATA.documents.some(doc => doc.path === item.source_path));
    }

    function orderedGraphNodes(model) {
      const nodes = (model && model.nodes || []).slice();
      const nodeIds = new Set(nodes.map(item => item.id));
      const incoming = new Map(nodes.map(item => [item.id, 0]));
      const outgoing = new Map(nodes.map(item => [item.id, []]));
      (model && model.edges || []).filter(edge => nodeIds.has(edge.from) && nodeIds.has(edge.to)).forEach(edge => {
        incoming.set(edge.to, (incoming.get(edge.to) || 0) + 1);
        outgoing.get(edge.from).push(edge.to);
      });
      const queue = nodes.filter(item => incoming.get(item.id) === 0).sort((a,b) => String(a.id).localeCompare(String(b.id), "zh-CN"));
      const ordered = [];
      while (queue.length) {
        const node = queue.shift();
        ordered.push(node);
        (outgoing.get(node.id) || []).slice().sort().forEach(target => {
          incoming.set(target, incoming.get(target) - 1);
          if (incoming.get(target) === 0) {
            const targetNode = nodes.find(item => item.id === target);
            if (targetNode) queue.push(targetNode);
            queue.sort((a,b) => String(a.id).localeCompare(String(b.id), "zh-CN"));
          }
        });
      }
      const used = new Set(ordered.map(item => item.id));
      return ordered.concat(nodes.filter(item => !used.has(item.id)).sort((a,b) => String(a.id).localeCompare(String(b.id), "zh-CN")));
    }

    function relationLabel(edge) {
      const labels = {
        contains:"包含", derived_from:"派生自", satisfies:"满足需求", has_acceptance:"具备验收",
        traced_by:"追踪到", verified_by:"由测试验证", depends_on:"依赖", decided_by:"受决策约束",
        implemented_by:"由任务实现", planned_for:"规划到", supersedes:"替代", calls:"调用",
        reads:"读取", writes:"写入", owns:"唯一拥有", emits:"产生", consumes:"消费",
        precedes:"进入", unlocks:"解锁", affects:"影响", mitigates:"控制"
      };
      return labels[edge && edge.relation] || edge && edge.label || edge && edge.relation || "关联";
    }

    function renderArchitectureOverview(model) {
      if (!model || model.status !== "ready" || !(model.nodes || []).length) return `<div class="empty">${escapeHtml((model && model.findings || []).map(item => item.reason).filter(Boolean).join("；") || "请在产品蓝图和总体架构中填写标准化表格。")}</div>`;
      const nodes = model.nodes || [];
      const groups = [
        {label:"用户与入口", types:new Set(["user_entry","user","actor"])},
        {label:"业务领域", types:new Set(["domain","data_domain"])},
        {label:"系统与依赖", types:null}
      ];
      const assigned = new Set();
      const lanes = groups.map(group => {
        const items = nodes.filter(node => {
          if (!group.types) return !assigned.has(node.id);
          if (!group.types.has(node.type)) return false;
          assigned.add(node.id);
          return true;
        }).sort((a,b) => String(a.label).localeCompare(String(b.label), "zh-CN"));
        const shown = items.slice(0,6);
        return `<section class="architecture-lane"><header><h4>${group.label}</h4><span>${items.length}</span></header><div class="architecture-node-list">${shown.map(node => {
          const source = nodeSource(node);
          const tag = source ? "button" : "div";
          return `<${tag} class="architecture-node" data-kind="${escapeHtml(node.type || "entity")}" ${source ? `data-open-doc="${escapeHtml(source.source_path)}"` : ""} title="${escapeHtml(`${node.id} · ${node.detail || node.label}`)}"><strong>${escapeHtml(node.label)}</strong><span>${escapeHtml(node.detail || "来源已登记")}</span></${tag}>`;
        }).join("") || '<div class="empty">当前没有该类节点。</div>'}${items.length > shown.length ? `<div class="architecture-more">另有 ${items.length-shown.length} 个节点，请在图谱查看</div>` : ""}</div></section>`;
      }).join("");
      const nodeById = new Map(nodes.map(node => [node.id,node]));
      const relations = (model.edges || []).filter(edge => nodeById.has(edge.from) && nodeById.has(edge.to));
      const relationRows = relations.slice(0,4).map(edge => {
        const source = (edge.sources || []).find(item => DATA.documents.some(doc => doc.path === item.source_path));
        const tag = source ? "button" : "div";
        return `<${tag} class="architecture-relation" ${source ? `data-open-doc="${escapeHtml(source.source_path)}"` : ""}><strong>${escapeHtml(nodeById.get(edge.from).label)} → ${escapeHtml(nodeById.get(edge.to).label)}</strong><span>${escapeHtml(relationLabel(edge))}</span><code>${escapeHtml(edge.label || edge.relation || "关联")}</code></${tag}>`;
      }).join("");
      return `<div class="architecture-board"><div class="architecture-lanes">${lanes}</div><div class="architecture-relations">${relationRows || '<div class="empty">当前没有结构化关系。</div>'}</div><footer class="architecture-footer"><span>${nodes.length} 个节点 · ${relations.length} 条关系${relations.length > 4 ? ` · 此处展示 4 条关键关系` : ""}</span><button class="command" data-jump-view="map">查看完整产品架构</button></footer></div>`;
    }

    function renderFlowRail(model, emptyText) {
      if (!model || model.status !== "ready" || !(model.nodes || []).length) return `<div class="empty">${escapeHtml((model && model.findings || []).map(item => item.reason).filter(Boolean).join("；") || emptyText)}</div>`;
      const nodes = orderedGraphNodes(model);
      const edges = model.edges || [];
      const steps = nodes.map((node,index) => {
        const source = nodeSource(node);
        const tag = source ? "button" : "div";
        const next = nodes[index+1];
        const edge = next ? edges.find(item => item.from === node.id && item.to === next.id) : null;
        const connector = next ? `<div class="journey-connector" title="${escapeHtml(edge && (edge.label || edge.relation) || "关系未登记")}"><strong>›</strong><span>${escapeHtml(edge ? relationLabel(edge) : "关联")}</span></div>` : "";
        return `<${tag} class="journey-step" ${source ? `data-open-doc="${escapeHtml(source.source_path)}"` : ""} title="${escapeHtml(`${node.id} · ${node.detail || node.label}`)}"><code>${escapeHtml(node.id)}</code><strong>${escapeHtml(node.label)}</strong><span>${escapeHtml(node.detail || "来源已登记")}</span></${tag}>${connector}`;
      }).join("");
      return `<div class="journey-rail">${steps}</div><div class="journey-meta"><span>${nodes.length} 个步骤 · ${edges.length} 条关系</span><span>点击步骤返回权威来源</span></div>`;
    }

    function renderSourceRows(sources) {
      const valid = (sources || []).filter(item => item.source_path);
      return `<div class="source-list">${valid.map(item => `<div class="source-row"><span><code>${escapeHtml(item.source_id || "source")}</code> · ${escapeHtml(item.source_path)}${item.source_section ? ` · ${escapeHtml(item.source_section)}` : ""}</span>${DATA.documents.some(doc => doc.path === item.source_path) ? `<button class="command" ${sourceAttributes(item)}>打开</button>` : ""}</div>`).join("") || '<div class="empty">当前没有可定位来源。</div>'}</div>`;
    }

    function renderOverview() {
      const overview = (DATA.views || {}).overview || {};
      const stats = overview.stats || {};
      const architecture = overview.product_architecture || {status:"unknown",nodes:[],edges:[],findings:[]};

        <section class="stats">
          ${stat("版本", stats.versions || 0, "当前与后续")}${stat("功能", stats.features || 0, "当前版本")}${stat("需求", stats.requirements || 0, "稳定 ID")}${stat("已确认决策", stats.accepted_decisions || 0, "权威记录")}${stat("文档", stats.documents || 0, "权威与派生")}
        </section>
        <section class="section" id="overview-architecture"><div class="section-head"><h3>产品全景</h3><span>${architecture.status === "ready" ? "用户、领域与系统关系" : "结构化来源未建立"}</span></div>${renderArchitectureOverview(architecture)}</section>
        <div class="overview-flow-grid">
          <section class="section" id="overview-flow"><div class="section-head"><h3>核心业务旅程</h3><span>结果与失败语义</span></div>${renderFlowRail(overview.core_flow, "核心业务流程表尚未形成有效行。")}</section>
          <section class="section" id="overview-version"><div class="section-head"><h3>版本主链</h3><span>目标与退出条件</span></div>${renderFlowRail(overview.version_chain, "版本序列表尚未形成有效行。")}</section>
        </div>
        <section class="section" id="overview-progress"><div class="section-head"><h3>当前交付进度</h3><span>工程落点、实现状态与机器证据</span></div><div class="progress-list">${progressEntries.map(([status,count]) => `<div class="progress-row"><span>${chip(status)}</span><div class="bar"><span style="width:${Math.max(3,count/progressTotal*100)}%"></span></div><strong>${count}</strong></div>`).join("") || '<div class="empty">当前版本尚无可确认的交付状态。</div>'}</div></section>
        <div class="two-column section">
          <section id="overview-decisions"><div class="section-head"><h3>已确认决策</h3><span>${decisions.length} 项</span></div><div class="quick-list">${decisions.map(item => `<div class="quick-row"><button ${item.source_path ? `data-open-doc="${escapeHtml(item.source_path)}"` : ""}>${escapeHtml(item.id)} · ${escapeHtml(item.title)}</button><span>${escapeHtml(item.decision || item.rationale || "已确认")}</span>${chip(item.status)}</div>`).join("") || '<div class="empty">当前没有已确认决策。</div>'}</div></section>
          <section id="overview-authority"><div class="section-head"><h3>权威入口</h3><span>直接进入正文</span></div><div class="quick-list">${authorities.map(item => `<div class="quick-row"><button data-open-doc="${escapeHtml(item.path)}">${escapeHtml(item.title)}</button><span>${escapeHtml(item.authority)}</span></div>`).join("") || '<div class="empty">未找到关键权威入口。</div>'}</div></section>
        </div>`;
      bindContentActions();
      renderOutline([{id:"overview-top",title:"项目全貌",level:1},{id:"overview-architecture",title:"产品全景",level:2},{id:"overview-flow",title:"核心业务旅程",level:2},{id:"overview-version",title:"版本主链",level:2},{id:"overview-progress",title:"交付进度",level:2},{id:"overview-decisions",title:"已确认决策",level:2},{id:"overview-authority",title:"权威入口",level:2}]);
    }

    function renderVerificationPanel() {

      const depth = governance.design_depth || {};

          ${governance.gates.map(gate => `<article class="gate-card ${escapeHtml(gate.status)}"><header><h3>${escapeHtml(gate.label)}</h3>${chip(gate.status)}</header><dl><dt>受控文档/功能</dt><dd>${gate.documents_total}</dd><dt>状态就绪</dt><dd>${gate.ready_documents}</dd><dt>含占位</dt><dd>${gate.placeholder_documents}</dd></dl><ul>${gate.blocking_signals.map(item => `<li>${escapeHtml(item)}</li>`).join("") || "<li>未发现结构阻塞；仍需实际执行 gate 命令。</li>"}</ul>${gate.path ? `<button class="command" data-open-doc="${escapeHtml(gate.path)}">查看权威入口</button>` : ""}</article>`).join("")}
        </div></section>
        <section class="section" id="governance-testing"><div class="section-head"><h3>测试分层</h3><span>定义覆盖与实际证据分开</span></div><div class="table-wrap"><table><thead><tr><th>层级</th><th>策略结构</th><th>证据类型</th><th>实际结果</th></tr></thead><tbody>
          ${governance.testing.map(item => `<tr><td>${escapeHtml(item.label)}</td><td>${chip(item.defined ? "structure_ready" : "blocked")}</td><td><code>${escapeHtml(item.evidence_type)}</code></td><td>${chip(item.evidence_result)}</td></tr>`).join("") || '<tr><td colspan="4">尚未派生测试分层。</td></tr>'}
        </tbody></table></div></section>
        <section class="section" id="governance-design"><div class="section-head"><h3>可解释设计深度</h3><span>函数契约、伪代码、稳定分支与追踪</span></div><div class="stats">
          ${stat("功能", depth.feature_total || 0, "当前版本")}
          ${stat("函数/单元契约", depth.unit_contracts || 0, "已建立结构")}
          ${stat("可执行伪代码", depth.pseudocode || 0, "不是自然语言占位")}

        </div><div class="table-wrap"><table><thead><tr><th>功能</th><th>风险</th><th>契约</th><th>伪代码</th><th>分支数</th><th>AC 追踪</th></tr></thead><tbody>
          ${DATA.features.map(item => `<tr><td><button class="command" data-open-doc="${escapeHtml(item.path)}">${escapeHtml(item.id)} · ${escapeHtml(item.title)}</button></td><td>${chip(item.risk)}</td><td>${chip(item.has_unit_contract ? "structure_ready" : "blocked")}</td><td>${chip(item.has_pseudocode ? "structure_ready" : "blocked")}</td><td>${item.branch_count}</td><td>${chip(item.branch_trace_complete ? "structure_ready" : "blocked")}</td></tr>`).join("") || '<tr><td colspan="6">当前没有功能规格。</td></tr>'}
        </tbody></table></div></section>
        <section class="section" id="governance-evidence"><div class="section-head"><h3>机器证据</h3><span>${binding.passed_reports || 0} / 4 通过 · 新鲜 ${binding.fresh_reports || 0} · 过期 ${binding.stale_reports || 0} · 同提交 ${binding.same_commit ? "是" : "否"} · 同构建 ${binding.same_build ? "是" : "否"}</span></div><div class="table-wrap"><table><thead><tr><th>类型</th><th>选择</th><th>环境</th><th>结果</th><th>新鲜度</th><th>commit/build</th><th>执行时间</th></tr></thead><tbody>
          ${governance.evidence.map(item => `<tr><td><code>${escapeHtml(item.type)}</code></td><td>${item.selected ? "已选择" : "未选择"}</td><td>${escapeHtml(item.environment)}</td><td>${chip(item.result)}</td><td>${chip(item.freshness)}${item.freshness_reasons && item.freshness_reasons.length ? `<div class="freshness-reason">${escapeHtml(item.freshness_reasons.join("；"))}</div>` : ""}</td><td>${escapeHtml(item.commit || "-")}<br>${escapeHtml(item.build_id || "-")}</td><td>${escapeHtml(item.executed_at || "-")}</td></tr>`).join("") || '<tr><td colspan="7">尚未建立证据清单。</td></tr>'}
        </tbody></table></div></section>`;
    }

    function renderChangeSummary(summary) {
      const counts = summary.counts || {};
      return `<div class="change-summary">${changeCount("新增",counts.added)}${changeCount("变化",counts.changed)}${changeCount("废弃",counts.deprecated)}${changeCount("删除",counts.removed)}</div><div class="section"><div class="blocker-list">${(summary.items || []).map(item => `<div class="change-row">${chip(item.change)}<code>${escapeHtml(item.id)}</code><span>${escapeHtml(item.summary)}${item.impact && item.impact.length ? ` · 影响 ${escapeHtml(item.impact.join("、"))}` : ""}</span>${item.source_path ? `<button class="command" data-open-doc="${escapeHtml(item.source_path)}">查看来源</button>` : ""}</div>`).join("") || '<div class="empty">最近两个快照没有语义变化。</div>'}</div></div>`;
    }

    function changeCount(label, value) { return `<div class="change-count"><span>${escapeHtml(label)}</span><strong>${Number(value || 0)}</strong></div>`; }

    function renderReader() {
      const doc = getActiveDoc();
      if (!doc) { els.content.innerHTML = '<div class="empty">当前没有可阅读文档。</div>'; return; }
      els.workspace.scrollTop = 0;
      const rendered = doc.kind === "md" ? renderMarkdown(doc.content, doc.path) : { html: `<pre><code>${escapeHtml(doc.content)}</code></pre>`, outline: [] };
      const context = readerContext(doc);
      els.content.innerHTML = `
        <header class="reader-header">
          <div class="reader-kicker"><span>${escapeHtml(cleanCategory(doc.category))}</span><span>/</span><span>${escapeHtml(doc.path)}</span></div>
          <h2>${escapeHtml(doc.title)}</h2>
          <div class="reader-meta">${chip(doc.status)}<span class="status-chip">${doc.line_count} 行</span><span class="status-chip">${rendered.outline.length} 章节</span><span class="status-chip">更新 ${escapeHtml(doc.updated)}</span></div>
          <p>${escapeHtml(doc.authority)}</p>
          ${context}
          <div class="view-actions"><a class="command" href="${escapeHtml(rootHref(doc.path))}" target="_blank" rel="noopener">打开 Markdown 原文</a><a class="command" href="${escapeHtml(rootHref(doc.path))}" download>下载 Markdown</a></div>
        </header>
        <article class="article" id="article">${rendered.html}</article>`;
      renderOutline(rendered.outline);
      bindArticleLinks(doc.path);
      els.content.querySelectorAll("[data-reader-feature]").forEach(button => button.addEventListener("click", () => {
        state.activeFeature = button.dataset.readerFeature;
        safeSet("daoge-docs.activeFeature", state.activeFeature);
        setView(button.dataset.readerView || "workbench");
      }));
      updateProgress();
      restoreReaderPosition(doc);
    }

    function readerContext(doc) {
      const feature = DATA.features.find(item => item.path === doc.path || item.design_path === doc.path);
      if (!feature) return "";
      const openFindings = (DATA.findings || []).filter(item => item.status === "open" && item.object_id === feature.id);
      return `<div class="reader-context"><span>开发上下文</span><strong>${escapeHtml(feature.id)} · ${escapeHtml(feature.title)}</strong><span>${escapeHtml(feature.domain)}</span>${chip(feature.risk)}${openFindings.length ? `<span>${openFindings.length} 项待处理</span>` : ""}<button class="command" data-reader-feature="${escapeHtml(feature.id)}" data-reader-view="workbench">回到工作台</button><button class="command" data-reader-feature="${escapeHtml(feature.id)}" data-reader-view="timeline">功能时间线</button></div>`;
    }

    function renderMap() {
      const maps = (DATA.views || {}).maps || {};
      const modes = Object.entries(MAP_META).map(([id,item]) => [id,item.label]);
      if (!maps[state.mapMode]) state.mapMode = modes[0][0];
      const selected = maps[state.mapMode] || {title:modes.find(item => item[0] === state.mapMode)?.[1] || "项目图谱",status:"unknown",nodes:[],edges:[],findings:[]};
      const meta = MAP_META[state.mapMode] || {label:selected.title,question:"查看当前项目已登记的结构化关系。"};
      const nodeById = new Map((selected.nodes || []).map(node => [node.id,node]));
      els.content.innerHTML = `
        <header class="view-header"><div><div class="eyebrow">项目关系</div><h2>项目关系图谱</h2><p>一次聚焦一种关系，先看业务含义，再按需查看稳定 ID 和权威来源。</p></div></header>
        <nav class="map-modes" aria-label="图谱类型">${modes.map(([id,label]) => `<button class="map-mode ${id === state.mapMode ? "active" : ""}" data-map-mode="${id}">${label}</button>`).join("")}</nav>
        <section class="map-summary" id="map-summary"><div><h3>${escapeHtml(meta.label)}</h3><span>${escapeHtml(meta.question)} · ${selected.nodes.length} 个节点 / ${selected.edges.length} 条关系</span></div>${chip(selected.status)}</section>
        <section class="map-visual" id="map-graph">${mapWarning(selected)}${renderMapModel(selected)}</section>
        ${(selected.edges || []).length ? `<details class="relation-details" id="map-relations"><summary>查看稳定 ID、完整关系与来源</summary><div class="table-wrap"><table><thead><tr><th>来源对象</th><th>关系</th><th>目标对象</th><th>说明</th><th>权威来源</th></tr></thead><tbody>${selected.edges.map(edge => { const source=(edge.sources||[])[0]||{}; const from=nodeById.get(edge.from); const to=nodeById.get(edge.to); return `<tr><td>${escapeHtml(from && from.label || edge.from)}<br><code>${escapeHtml(edge.from)}</code></td><td>${escapeHtml(relationLabel(edge))}</td><td>${escapeHtml(to && to.label || edge.to)}<br><code>${escapeHtml(edge.to)}</code></td><td>${escapeHtml(edge.label)}</td><td>${source.source_path && DATA.documents.some(doc => doc.path === source.source_path) ? `<button class="command" ${sourceAttributes(source)}>${escapeHtml(source.source_section || "打开来源")}</button>` : escapeHtml(source.source_path || "未登记")}</td></tr>`; }).join("")}</tbody></table></div></details>` : ""}`;
      els.content.querySelectorAll("[data-map-mode]").forEach(button => button.addEventListener("click", () => { state.mapMode = button.dataset.mapMode; safeSet("daoge-docs.mapMode", state.mapMode); updateHash(); renderMap(); }));
      const deliveryFeature = document.getElementById("deliveryFeature");
      if (deliveryFeature) deliveryFeature.addEventListener("change", event => { state.activeFeature = event.target.value; safeSet("daoge-docs.activeFeature", state.activeFeature); updateHash(); renderMap(); });
      bindContentActions();
      revealActiveTab(".map-modes .map-mode.active");
      renderOutline([{ id: "map-summary", title: selected.title, level: 1 }, { id: "map-graph", title: "关系图", level: 2 }, { id: "map-relations", title: "完整关系", level: 2 }]);
    }

    function evolutionRelationLabel(value) {
      return ({compatible:"保持兼容",migration:"迁移",deprecation:"废弃",replacement:"替代"})[value] || value || "演进关系";
    }

    function evolutionWarning(evolution) {
      if (evolution.status === "ready") return "";
      const reasons = (evolution.findings || []).map(item => item.reason).filter(Boolean);
      const visible = reasons.slice(0,3);
      const remaining = reasons.length - visible.length;
      return `<div class="evolution-warning"><strong>${evolution.status === "blocked" ? "信息不完整" : "暂不可用"}</strong><span>${escapeHtml(visible.join("；") || "版本路线、能力里程碑或演进关系的结构化来源尚未建立。")}${remaining > 0 ? `；另有 ${remaining} 项来源问题` : ""}${(evolution.milestones || []).length ? "。当前只展示已登记内容，不能视为完整演进关系。" : ""}</span></div>`;
    }

    function setEvolutionFocus(trackId, stageId, milestoneId = "") {
      state.evolutionTrack = trackId || "";
      state.evolutionStage = stageId || "";
      state.evolutionMilestone = milestoneId || "";
      safeSet("daoge-docs.evolutionTrack", state.evolutionTrack);
      safeSet("daoge-docs.evolutionStage", state.evolutionStage);
      safeSet("daoge-docs.evolutionMilestone", state.evolutionMilestone);
      updateHash();
      renderEvolution();
    }

    function renderEvolution() {
      const evolution = (DATA.views || {}).evolution || {status:"unknown",versions:[],stages:[],tracks:[],milestones:[],relationships:[],findings:[]};
      const versions = evolution.versions || [];
      const tracks = evolution.tracks || [];
      const milestones = evolution.milestones || [];
      const relationships = evolution.relationships || [];
      const stages = (evolution.stages || []).length ? evolution.stages : versions.map((item,index) => ({id:item.id,label:item.id,kind:"version",order:index,status:item.status,sources:item.sources||[]}));
      const changeSummary = DATA.change_summary || {available:false,counts:{},items:[]};
      const trackById = new Map(tracks.map(item => [item.id,item]));
      const milestoneById = new Map(milestones.map(item => [item.id,item]));
      const versionById = new Map(versions.map(item => [item.id,item]));
      const stageById = new Map(stages.map(item => [item.id,item]));
      const milestonesFor = (trackId,stageId) => milestones.filter(item => item.track_id === trackId && (item.stage_keys || [item.version]).includes(stageId));
      if (!trackById.has(state.evolutionTrack)) state.evolutionTrack = tracks[0] ? tracks[0].id : "";
      let selectedTrackMilestones = milestones.filter(item => item.track_id === state.evolutionTrack);
      if (!stageById.has(state.evolutionStage) || !milestonesFor(state.evolutionTrack,state.evolutionStage).length) {
        const current = milestonesFor(state.evolutionTrack,DATA.project.current_version)[0];
        const fallback = current || selectedTrackMilestones[0] || milestones[0];
        if (fallback) {
          state.evolutionTrack = fallback.track_id;
          state.evolutionStage = (fallback.stage_keys || [fallback.version])[0] || "";

    function parseStructuredQuery(value) {
      const fields = {};
      const text = [];
      String(value || "").split(/\s+/).filter(Boolean).forEach(token => {
        const match = /^([a-z-]+):(.+)$/.exec(token);
        if (match) fields[match[1]] = match[2]; else text.push(token);
      });
      return { fields, text: text.join(" ") };
    }

    function matchesStructured(item, type, parsed) {
      const fields = parsed.fields || {};
      const field = name => String(fields[name] || "").toLowerCase();
      if (field("type") && field("type") !== type) return false;
      if (field("id") && !String(item.id || item.path || "").toLowerCase().includes(field("id"))) return false;
      if (field("path") && !String(item.path || item.source_path || "").toLowerCase().includes(field("path"))) return false;
      if (field("status") && String(item.status || "").toLowerCase() !== field("status")) return false;
      if (field("risk") && String(item.risk || "").toLowerCase() !== field("risk")) return false;
      if (field("version") && String(item.version || DATA.project.current_version).toLowerCase() !== field("version")) return false;
      if (field("stage") && String(item.stage || "").toLowerCase() !== field("stage")) return false;
      if (field("has") === "evidence" && !(item.acceptance_evidenced > 0 || item.evidence_type || item.result === "passed")) return false;
      if (field("missing") === "pseudocode" && item.has_pseudocode !== false) return false;
      if (parsed.text) {
        const haystack = JSON.stringify(item).toLowerCase();
        if (!haystack.includes(parsed.text.toLowerCase())) return false;
      }
      return true;
    }

    function renderMarkdown(source, sourcePath) {
      let lines = source.replace(/\r\n/g, "\n").split("\n");
      if (lines[0] && lines[0].trim() === "---") {
        const end = lines.slice(1).findIndex(line => line.trim() === "---");
        if (end >= 0) lines = lines.slice(end + 2);
      }
      const references = collectMarkdownReferences(lines);
      const documentRecord = DATA.documents.find(doc => doc.path === sourcePath);
      const sections = documentRecord && Array.isArray(documentRecord.sections) ? documentRecord.sections : [];
      const output = [];
      const outline = [];
      let index = 0;
      while (index < lines.length) {
        const line = lines[index];
        if (/^```/.test(line)) {
          const lang = line.replace(/^```/, "").trim();
          const code = [];
          index += 1;
          while (index < lines.length && !/^```/.test(lines[index])) { code.push(lines[index]); index += 1; }
          index += 1;
          output.push(`<pre><code data-lang="${escapeHtml(lang)}">${escapeHtml(code.join("\n"))}</code></pre>`);
          continue;
        }
        const heading = /^(#{1,6})\s+(.+?)\s*#*\s*$/.exec(line);
        if (heading) {
          const level = heading[1].length;
          const title = heading[2].trim();
          const section = sections[outline.length];
          const id = section && section.id || headingId(title, outline.length);
          outline.push({ id, title, level, line_start: section && section.line_start || 0 });
          output.push(`<h${level} id="${id}">${inline(title, sourcePath, references)}</h${level}>`);
          index += 1;
          continue;
        }
        if (isTableStart(lines, index)) {
          const block = [];
          while (index < lines.length && /^\s*\|.*\|\s*$/.test(lines[index])) { block.push(lines[index]); index += 1; }
          output.push(renderTable(block, sourcePath, references));
          continue;
        }
        const image = /^!\[([^\]]*)\]\(([^)]+)\)\s*$/.exec(line.trim());
        if (image) { output.push(renderImage(image[1], image[2], sourcePath)); index += 1; continue; }
        const list = parseMarkdownList(lines, index, sourcePath, references);
        if (list) { output.push(list.html); index = list.next; continue; }
        if (/^\s*>\s?/.test(line)) {
          const quote = [];
          while (index < lines.length && /^\s*>\s?/.test(lines[index])) { quote.push(lines[index].replace(/^\s*>\s?/, "")); index += 1; }
          output.push(`<blockquote>${quote.map(item => inline(item, sourcePath, references)).join("<br>")}</blockquote>`);
          continue;
        }
        if (/^\s*(---|\*\*\*)\s*$/.test(line)) { output.push("<hr>"); index += 1; continue; }
        if (!line.trim() || isMarkdownReference(line)) { index += 1; continue; }
        const paragraph = [line];
        index += 1;
        while (index < lines.length && lines[index].trim() && !/^(#{1,6})\s+|^```|^\s*[-*+]\s+|^\s*\d+[.)]\s+|^\s*>\s?/.test(lines[index]) && !isTableStart(lines,index) && !isMarkdownReference(lines[index])) {
          paragraph.push(lines[index]); index += 1;
        }
        output.push(`<p>${inline(paragraph.join(" "), sourcePath, references)}</p>`);
      }
      return { html: output.join("\n"), outline };
    }

    function collectMarkdownReferences(lines) {
      return lines.reduce((result, line) => {
        const match = /^\s*\[([^\]]+)\]:\s*(\S+)(?:\s+["'(].*)?\s*$/.exec(line);
        if (match) result[match[1].trim().toLowerCase()] = match[2];
        return result;
      }, {});
    }

    function isMarkdownReference(line) { return /^\s*\[[^\]]+\]:\s*\S+/.test(line); }

    function parseMarkdownList(lines, start, sourcePath, references) {
      const first = /^(\s*)([-*+]|\d+[.)])\s+(.+)$/.exec(lines[start]);
      if (!first) return null;
      const ordered = /^\d/.test(first[2]);
      const baseIndent = first[1].replace(/\t/g, "    ").length;
      const items = [];
      let index = start;
      while (index < lines.length) {
        const match = /^(\s*)([-*+]|\d+[.)])\s+(.+)$/.exec(lines[index]);
        if (!match) break;
        const indent = match[1].replace(/\t/g, "    ").length;
        if (indent !== baseIndent || (/^\d/.test(match[2]) !== ordered)) break;
        const itemLines = [match[3]];
        index += 1;
        while (index < lines.length) {
          const next = lines[index];
          if (!next.trim()) {
            if (index + 1 < lines.length && /^\s+/.test(lines[index + 1])) { itemLines.push(""); index += 1; continue; }
            break;
          }
          const nextList = /^(\s*)([-*+]|\d+[.)])\s+/.exec(next);
          const nextIndent = next.match(/^\s*/)[0].replace(/\t/g, "    ").length;
          if (nextList && nextIndent <= baseIndent) break;
          if (nextIndent <= baseIndent) break;
          itemLines.push(next.slice(Math.min(next.length, baseIndent + 2)));
          index += 1;
        }
        items.push(itemLines);
        while (index < lines.length && !lines[index].trim()) index += 1;
      }
      const tag = ordered ? "ol" : "ul";
      return { html: `<${tag}>${items.map(item => renderListItem(item, sourcePath, references)).join("")}</${tag}>`, next: index };
    }

    function renderListItem(lines, sourcePath, references) {
      const first = lines[0] || "";
      const task = /^\[([ xX])\]\s+(.+)$/.exec(first);
      const text = task ? task[2] : first;
      const nested = lines.slice(1).join("\n").trim();
      const nestedLines = nested ? nested.split("\n") : [];
      const nestedList = nestedLines.length ? parseMarkdownList(nestedLines, 0, sourcePath, references) : null;
      const suffix = nestedList && nestedList.next === nestedLines.length ? nestedList.html : nested ? `<br>${inline(nested.replace(/\n+/g, " "), sourcePath, references)}` : "";
      const checkbox = task ? `<input type="checkbox" disabled ${/[xX]/.test(task[1]) ? "checked" : ""}>` : "";
      return `<li${task ? ' class="task-item"' : ""}>${checkbox}${inline(text, sourcePath, references)}${suffix}</li>`;
    }

    function inline(value, sourcePath, references = {}) {
      const placeholders = [];

      for (const char of trimmed) {
        if (char === "`") { codeSpan = !codeSpan; current += char; continue; }

        if (char.charCodeAt(0) === 92) { escaped = true; continue; }

      cells.push(current.trim());
      return cells;

      }
      if ((state.view === "workbench" || state.view === "timeline") && state.activeFeature) params.set("feature", state.activeFeature);
      if (((state.view === "workbench" && state.panel === "verification") || (state.view === "evolution" && state.panel === "changes"))) params.set("panel", state.panel);
      const hash = `#${params}`;
      try { (replace ? history.replaceState : history.pushState).call(history, null, "", hash); }
      catch { if (location.hash !== hash) location.hash = hash; }
    }
    function toggleDrawer(type) { document.body.classList.toggle(type==="nav"?"nav-open":"outline-open"); document.body.classList.remove(type==="nav"?"outline-open":"nav-open"); }
    function closeDrawers() { document.body.classList.remove("nav-open","outline-open"); }
    function revealActiveTab(selector) {
      const active = document.querySelector(selector);
      if (active) window.setTimeout(() => active.scrollIntoView({ block:"nearest", inline:"nearest" }), 0);
    }

    init();
  </script>
</body>
